name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m py_compile gui.py main.py translator_core.py build.py check_hostapis.py debug_audio.py
